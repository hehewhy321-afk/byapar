apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

def projectRoot = rootDir.getAbsoluteFile().getParentFile().getAbsolutePath()

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    entryFile = file(["node", "-e", "require('expo/scripts/resolveAppEntry')", projectRoot, "android", "absolute"].execute(null, rootDir).text.trim())
    reactNativeDir = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()
    hermesCommand = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsolutePath() + "/sdks/hermesc/%OS-BIN%/hermesc"
    codegenDir = new File(["node", "--print", "require.resolve('@react-native/codegen/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()

    // Use Expo CLI to bundle the app, this ensures the Metro config
    // implements Expo.
    cliFile = new File(["node", "--print", "require.resolve('@expo/cli', { paths: [require.resolve('expo/package.json')] })"].execute(null, rootDir).text.trim())
    bundleCommand = "export:embed"

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = (findProperty('android.enableProguardInReleaseBuilds') ?: false).toBoolean()

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 */
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    ndkVersion rootProject.ext.ndkVersion

    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.byapar"
    defaultConfig {
        applicationId "com.byapar"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            shrinkResources (findProperty('android.enableShrinkResourcesInReleaseBuilds')?.toBoolean() ?: false)
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            crunchPngs (findProperty('android.enablePngCrunchInReleaseBuilds')?.toBoolean() ?: true)
        }
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging false
            excludes += [
                "**/libbarhopper_v3.so",
                "**/libandroidx.graphics.path.so"
            ]
        }
    }
    androidResources {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
}

// Apply static values from `gradle.properties` to the `android.packagingOptions`
// Accepts values in comma delimited lists, example:
// android.packagingOptions.pickFirsts=/LICENSE,**/picasa.ini
["pickFirsts", "excludes", "merges", "doNotStrip"].each { prop ->
    // Split option: 'foo,bar' -> ['foo', 'bar']
    def options = (findProperty("android.packagingOptions.$prop") ?: "").split(",");
    // Trim all elements in place.
    for (i in 0..<options.size()) options[i] = options[i].trim();
    // `pickFirst`... delegates to `android.packagingOptions[prop]`
    options.each {
        if (it) {
            android.packagingOptions[prop] += it
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    implementation("androidx.activity:activity-ktx:1.9.3")

    def isGifEnabled = (findProperty('expo.gif.enabled') ?: "") == "true";
    def isWebpEnabled = (findProperty('expo.webp.enabled') ?: "") == "true";
    def isWebpAnimatedEnabled = (findProperty('expo.webp.animated') ?: "") == "true";

    if (isGifEnabled) {
        // For animated gif support
        implementation("com.facebook.fresco:animated-gif:${reactAndroidLibs.versions.fresco.get()}")
    }

    if (isWebpEnabled) {
        // For webp support
        implementation("com.facebook.fresco:webpsupport:${reactAndroidLibs.versions.fresco.get()}")
        if (isWebpAnimatedEnabled) {
            // Animated webp support
            implementation("com.facebook.fresco:animated-webp:${reactAndroidLibs.versions.fresco.get()}")
        }
    }

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    // Firebase BoM & Google Analytics (connected to byapar-nepal via google-services.json)
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-analytics'
}

// Auto-patch 16 KB ELF page alignment for all 64-bit native libraries (.so)
def patchElfAlignment(File soFile) {
    if (!soFile.name.endsWith(".so")) return
    try {
        RandomAccessFile raf = new RandomAccessFile(soFile, "rw")
        try {
            byte[] magic = new byte[4]
            raf.readFully(magic)
            if (magic[0] != 0x7F || magic[1] != 0x45 || magic[2] != 0x4C || magic[3] != 0x46) {
                return
            }
            int eiClass = raf.readByte()
            if (eiClass != 2) {
                // Only 64-bit ELF (arm64-v8a / x86_64) requires 16 KB alignment
                return
            }
            raf.seek(32)
            long phoff = Long.reverseBytes(raf.readLong())
            raf.seek(54)
            int phentsize = Short.reverseBytes(raf.readShort()) & 0xFFFF
            int phnum = Short.reverseBytes(raf.readShort()) & 0xFFFF

            for (int i = 0; i < phnum; i++) {
                long entryOffset = phoff + (i * phentsize)
                raf.seek(entryOffset)
                int p_type = Integer.reverseBytes(raf.readInt())
                if (p_type == 1) { // PT_LOAD
                    long alignOffset = entryOffset + 48
                    raf.seek(alignOffset)
                    long currentAlign = Long.reverseBytes(raf.readLong())
                    if (currentAlign < 16384L) {
                        raf.seek(alignOffset)
                        raf.writeLong(Long.reverseBytes(16384L))
                    }
                }
            }
        } finally {
            raf.close()
        }
    } catch (Exception e) {
        logger.warn("Could not patch ELF alignment for ${soFile.name}: ${e.message}")
    }
}

// Hook into native libs merge and strip tasks to ensure 16 KB ELF load segment alignment
tasks.matching { task ->
    (task.name.startsWith("merge") && task.name.endsWith("NativeLibs")) ||
    (task.name.startsWith("strip") && task.name.endsWith("DebugSymbols"))
}.configureEach { task ->
    task.doLast {
        def nativeDirs = [
            file("${project.buildDir}/intermediates/merged_native_libs"),
            file("${project.buildDir}/intermediates/stripped_native_libs")
        ]
        nativeDirs.each { dir ->
            if (dir.exists()) {
                dir.eachFileRecurse { f ->
                    if (f.isFile() && f.name.endsWith(".so") && (f.path.contains("arm64-v8a") || f.path.contains("x86_64"))) {
                        patchElfAlignment(f)
                    }
                }
            }
        }
    }
}

apply plugin: "com.google.gms.google-services"


